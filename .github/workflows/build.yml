name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4


      - name: Check out AdGuard Home source
        uses: actions/checkout@v4
        with:
          repository: AdguardTeam/AdGuardHome
          ref: v0.107.79
          path: .ci/AdGuardHome

      - name: Set up Go for AdGuard Home
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: false

      - name: Set up Node for AdGuard Home frontend
        uses: actions/setup-node@v4
        with:
          node-version: '24.10.0'
          cache: npm
          cache-dependency-path: .ci/AdGuardHome/client_v2/package-lock.json

      - name: Build AdGuard Home for Android ARM and ARM64
        run: |
          set -euxo pipefail
          cd .ci/AdGuardHome
          # AdGuard Home's build metadata script calculates master..HEAD; this checkout is a tag.
          git branch master HEAD
          make js-deps
          make js-build
          make go-deps
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/assets/adguardhome"
          cp LICENSE.txt "$GITHUB_WORKSPACE/app/src/main/assets/adguardhome/LICENSE.txt"
          printf '%s\n' 'AdGuard Home v0.107.79' 'Source: https://github.com/AdguardTeam/AdGuardHome/tree/v0.107.79' 'Built for Android by LANVault CI; see upstream GPL-3.0 license.' > "$GITHUB_WORKSPACE/app/src/main/assets/adguardhome/SOURCE.txt"
          GOOS=android GOARCH=arm GOARM=5 make go-build CHANNEL=release VERSION=v0.107.79 OUT="$GITHUB_WORKSPACE/app/src/main/assets/adguardhome/AdGuardHome-android-arm"
          GOOS=android GOARCH=arm64 make go-build CHANNEL=release VERSION=v0.107.79 OUT="$GITHUB_WORKSPACE/app/src/main/assets/adguardhome/AdGuardHome-android-arm64"
          file "$GITHUB_WORKSPACE/app/src/main/assets/adguardhome/AdGuardHome-android-arm"
          file "$GITHUB_WORKSPACE/app/src/main/assets/adguardhome/AdGuardHome-android-arm64"
          test -s "$GITHUB_WORKSPACE/app/src/main/assets/adguardhome/AdGuardHome-android-arm"
          test -s "$GITHUB_WORKSPACE/app/src/main/assets/adguardhome/AdGuardHome-android-arm64"
          chmod 644 "$GITHUB_WORKSPACE/app/src/main/assets/adguardhome/LICENSE.txt" "$GITHUB_WORKSPACE/app/src/main/assets/adguardhome/SOURCE.txt"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          curl -sSL -o /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Check web JavaScript syntax
        run: node --check app/src/main/assets/web/app.js

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lanvault-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
