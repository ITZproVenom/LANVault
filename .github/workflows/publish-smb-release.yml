name: Publish LANVault modern UI preview

on:
  push:
    branches:
      - feature/tv-network-monitor
    paths:
      - .github/workflows/publish-smb-release.yml
      - .github/workflows/publish-modern-ui-release.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: lanvault-modern-ui-release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Select the exact successful UI APK build
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target_sha="a467594f09eff4506b053f1be921e8a8d00381b6"
          runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build.yml --branch feature/tv-network-monitor --json databaseId,status,conclusion,headSha --limit 100)"
          match="$(printf '%s' "$runs" | jq -c --arg sha "$target_sha" '[.[] | select(.headSha == $sha and .status == "completed" and .conclusion == "success")] | sort_by(.databaseId) | last // empty')"
          if [ -z "$match" ]; then
            echo "No successful APK build found for exact source commit $target_sha."
            exit 1
          fi
          run_id="$(printf '%s' "$match" | jq -r '.databaseId')"
          source_sha="$(printf '%s' "$match" | jq -r '.headSha')"
          echo "Publishing verified UI APK from build $run_id ($source_sha)."
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Download the verified APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "${{ steps.build.outputs.run_id }}" --repo "$GITHUB_REPOSITORY" --name lanvault-release-apk --dir release-artifact
          apk="$(find release-artifact -type f -name '*.apk' -print -quit)"
          if [ -z "$apk" ]; then
            echo "No APK was found in the successful workflow artifact."
            find release-artifact -maxdepth 3 -type f -print
            exit 1
          fi
          asset="lanvault-1.0.4-modern-ui-preview.apk"
          cp "$apk" "$asset"
          sha256sum "$asset" > SHA256SUMS.txt
          test -s "$asset"
          file "$asset"
          cat SHA256SUMS.txt

      - name: Publish the modern UI preview
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GH_RELEASE_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          GITHUB_RELEASE_TOKEN: ${{ secrets.GITHUB_RELEASE_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          GH_TOKEN_SECRET: ${{ secrets.GH_TOKEN }}
          FALLBACK_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v1.0.4-modern-ui-preview"
          if GH_TOKEN="$FALLBACK_GITHUB_TOKEN" gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to overwrite a published release."
            exit 1
          fi
          asset="lanvault-1.0.4-modern-ui-preview.apk"
          notes="Modern UI preview built from commit ${{ steps.build.outputs.source_sha }}. Rebuilds the Android TV dashboard and browser interface from scratch. Includes the bundled AdGuard Home service and SMB2/3 support alongside WebDAV. Android unit tests, web JavaScript syntax check, release APK assembly, and lint passed in CI. Real Android TV and iPhone Files testing is still required."
          published=0
          for token_name in RELEASE_TOKEN GH_RELEASE_TOKEN GITHUB_RELEASE_TOKEN GH_PAT PAT_TOKEN PERSONAL_ACCESS_TOKEN GH_TOKEN_SECRET FALLBACK_GITHUB_TOKEN; do
            token="${!token_name}"
            if [ -z "$token" ]; then
              continue
            fi
            echo "Attempting to create the modern UI release using token source: $token_name"
            if GH_TOKEN="$token" gh release create "$tag" \
              "$asset" SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" \
              --target "${{ steps.build.outputs.source_sha }}" \
              --title "LANVault 1.0.4 Modern UI preview" \
              --prerelease \
              --notes "$notes"; then
              published=1
              break
            fi
            echo "Release creation was denied for this token source."
          done

          if [ "$published" -ne 1 ]; then
            echo "Creating a new release is not permitted by the current token; trying to add a clearly versioned APK asset to the existing preview release."
            checksum="SHA256SUMS-modern-ui-preview.txt"
            sha256sum "$asset" > "$checksum"
            for token_name in RELEASE_TOKEN GH_RELEASE_TOKEN GITHUB_RELEASE_TOKEN GH_PAT PAT_TOKEN PERSONAL_ACCESS_TOKEN GH_TOKEN_SECRET FALLBACK_GITHUB_TOKEN; do
              token="${!token_name}"
              if [ -z "$token" ]; then
                continue
              fi
              if GH_TOKEN="$token" gh release upload "v1.0.3-smb-preview" "$asset" "$checksum" --repo "$GITHUB_REPOSITORY"; then
                published=2
                break
              fi
              echo "Asset upload was denied for this token source."
            done
          fi

          if [ "$published" -eq 1 ]; then
            GH_TOKEN="$FALLBACK_GITHUB_TOKEN" gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url,tagName,isPrerelease,assets
          elif [ "$published" -eq 2 ]; then
            GH_TOKEN="$FALLBACK_GITHUB_TOKEN" gh release view "v1.0.3-smb-preview" --repo "$GITHUB_REPOSITORY" --json url,tagName,isPrerelease,assets
          else
            echo "No configured token could publish a new release or upload an asset to the existing preview."
            exit 1
          fi
